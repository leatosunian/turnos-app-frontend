<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>TurnosApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- El favicon es el mismo logo del loader y del header, con fondo oscuro para que se lea
       en pestañas claras y oscuras. El svg es el que usan los navegadores actuales; el ico
       (16, 32 y 48 px sacados del mismo svg) queda para los que no leen svg. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Loader de pantalla completa. Esta aca y no en un componente para que se vea apenas abre
       la pagina, antes de que termine de bajar Angular. Lo saca CargadorService cuando la app
       ya tiene algo para mostrar. Los estilos estan en styles.css (clases cargador). -->
  <div id="cargador" class="cargador" role="status" aria-label="Cargando TurnosApp">
    <div class="cargador-logo">
      <svg width="44" height="44" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="1" y="1" width="24" height="24" rx="7" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M8 13h10M13 8v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span>TurnosApp</span>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
