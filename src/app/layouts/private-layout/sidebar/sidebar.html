@if (abierto()) {
  <div class="fixed inset-0 z-30 bg-black/40 md:hidden" (click)="cerrar.emit()"></div>
}

<aside
  class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col bg-gray-900 text-gray-300 transition-transform md:static md:translate-x-0"
  [class.-translate-x-full]="!abierto()"
>
  <div class="px-6 py-5 text-lg font-bold text-white">TurnosApp</div>

  <nav class="flex-1 px-3">
    <ul class="space-y-1">
      @for (link of links; track link.ruta) {
        <li>
          <a
            [routerLink]="link.ruta"
            routerLinkActive="bg-gray-800 text-white"
            [routerLinkActiveOptions]="{ exact: link.ruta === '/panel' }"
            class="block rounded-md px-3 py-2 text-sm hover:bg-gray-800 hover:text-white"
            (click)="cerrar.emit()"
          >
            {{ link.texto }}
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
