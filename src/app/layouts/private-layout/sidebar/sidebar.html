<nav
  [attr.aria-label]="admin() ? 'Administración' : 'Panel'"
  class="flex h-full flex-col gap-6 px-3.5 py-6"
>
  <div class="flex flex-wrap items-center gap-x-2.5 gap-y-2 px-2.5">
    <svg width="26" height="26" viewBox="0 0 26 26" class="shrink-0 text-accent" aria-hidden="true">
      <rect
        x="1"
        y="1"
        width="24"
        height="24"
        rx="7"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      />
      <path d="M8 13h10M13 8v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
    <span class="text-lg font-bold tracking-tight">TurnosApp</span>
    @if (admin()) {
      <span
        class="inline-flex w-fit self-start rounded-full bg-info-soft px-2.5 py-0.5 text-label text-info"
      >
        Admin
      </span>
    }
  </div>

  @if (!admin()) {
    <button
      type="button"
      class="flex h-10 items-center justify-center rounded-control bg-accent font-semibold text-on-accent hover:bg-accent-hover"
    >
      + Nuevo turno
    </button>
  }

  @for (grupo of grupos(); track $index) {
    <div class="flex flex-col gap-0.5">
      @if (grupo.titulo) {
        <span class="px-2.5 pb-1.5 text-label text-faint">{{ grupo.titulo }}</span>
      }
      @for (link of grupo.links; track link.ruta) {
        <a
          [routerLink]="link.ruta"
          routerLinkActive="bg-surface-2 text-fg"
          [routerLinkActiveOptions]="{ exact: true }"
          #rla="routerLinkActive"
          [class.text-fg-2]="!rla.isActive"
          class="rounded-lg px-2.5 py-2 hover:text-fg"
        >
          {{ link.texto }}
        </a>
      }
    </div>
  }

  <!-- tarjeta del usuario logueado. El mt-auto la empuja al fondo del sidebar -->
  @if (usuario(); as usuario) {
    <div class="mt-auto flex flex-col rounded-card border border-line bg-surface-1">
      <div class="flex items-center gap-2.5 p-3">
        <span
          aria-hidden="true"
          class="flex size-9 shrink-0 items-center justify-center rounded-xl border border-line-strong bg-surface-3 text-[13px] font-bold text-accent"
        >
          {{ iniciales() }}
        </span>
        <div class="flex min-w-0 flex-col">
          <span class="truncate font-semibold">{{ usuario.name }}</span>
          <!-- el title muestra el email entero al pasar el mouse, por si no entra -->
          <span class="truncate text-small text-muted" [title]="usuario.email">
            {{ usuario.email }}
          </span>
        </div>
      </div>
      <button
        type="button"
        (click)="cerrarSesion()"
        class="flex items-center gap-2.5 border-t border-line px-3 py-2.5 text-muted hover:text-fg"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M14 5h5v14h-5M10 8l-4 4 4 4M6 12h10" />
        </svg>
        Cerrar sesión
      </button>
    </div>
  }
</nav>
