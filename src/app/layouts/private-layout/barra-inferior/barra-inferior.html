<nav
  [attr.aria-label]="admin() ? 'Administración' : 'Panel'"
  class="fixed inset-x-2.5 bottom-2.5 z-20 grid h-16 grid-cols-4 items-center rounded-container border border-line-strong bg-surface-2 text-[11px]"
>
  @for (link of links(); track link.ruta) {
    <a
      [routerLink]="link.ruta"
      routerLinkActive
      [routerLinkActiveOptions]="{ exact: true }"
      #rla="routerLinkActive"
      [class.text-muted]="!rla.isActive"
      [class.text-accent]="rla.isActive && !admin()"
      [class.text-info]="rla.isActive && admin()"
      class="flex flex-col items-center gap-1"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        @switch (link.icono) {
          @case ('hoy') {
            <circle cx="12" cy="12" r="8" />
            <path d="M12 8v4l3 2" />
          }
          @case ('agenda') {
            <rect x="4" y="5" width="16" height="15" rx="3" />
            <path d="M4 10h16M9 3v4M15 3v4" />
          }
          @case ('metricas') {
            <path d="M5 19V11M12 19V5M19 19v-6" />
          }
          @case ('usuarios') {
            <circle cx="9" cy="8" r="3.5" />
            <path
              d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5M16 4.5a3.5 3.5 0 0 1 0 7M21 19c-.4-2-1.5-3.5-3-4.3"
            />
          }
          @case ('negocios') {
            <path d="M4 9l1.5-4h13L20 9M4 9v10h16V9M4 9h16M9 19v-5h6v5" />
          }
          @case ('rubros') {
            <path d="M4 4h7l9 9-7 7-9-9z" />
            <circle cx="8.5" cy="8.5" r="1.3" />
          }
        }
      </svg>
      {{ link.texto }}
    </a>
  }

  @if (!admin()) {
    <!-- el menú que abre "Más" es de TA-24 -->
    <button type="button" class="flex flex-col items-center gap-1 text-muted">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
      Más
    </button>
  }
</nav>
