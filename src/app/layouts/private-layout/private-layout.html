<div class="flex min-h-screen bg-gray-50">
  <app-sidebar [abierto]="menuAbierto()" (cerrar)="menuAbierto.set(false)" />

  <div class="flex flex-1 flex-col">
    <header class="flex items-center gap-3 border-b border-gray-200 bg-white px-4 py-3 md:hidden">
      <button
        type="button"
        class="rounded p-1 text-2xl leading-none hover:bg-gray-100"
        aria-label="Abrir menú"
        (click)="menuAbierto.set(true)"
      >
        ☰
      </button>
      <span class="font-semibold">TurnosApp</span>
    </header>

    <main class="flex-1 p-6">
      <router-outlet />
    </main>
  </div>
</div>
